name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65
          pip install pillow

      - name: Build ROM
        run: |
          python3 build.py
          cp build/game.sfc "subterra-annihilation-${GITHUB_REF_NAME}.sfc"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "subterra-annihilation-${GITHUB_REF_NAME}.sfc" \
            --title "$GITHUB_REF_NAME" --generate-notes
